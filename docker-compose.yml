services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderpilot
      POSTGRES_PASSWORD: orderpilot
      POSTGRES_DB: orderpilot
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderpilot -d orderpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    # Apply database migrations, then start the API.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://orderpilot:orderpilot@db:5432/orderpilot
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      STORE_API_URL: ${STORE_API_URL:-http://host.docker.internal:8001}
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
